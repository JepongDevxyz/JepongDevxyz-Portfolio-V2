name: Import Portfolio V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-from-v1.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone verified portfolio source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/JepongDevxyz/JepongDevxyz-Portfolio.git /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/source/ ./

      - name: Verify imported source
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit imported V2 source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import verified portfolio-2025 upstream build into Portfolio V2"
          git push origin HEAD:main

# trigger import
